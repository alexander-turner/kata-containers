name: CI | CLH VFIO cold plug (nested, emulated device)

# Exercises runtime-rs VFIO cold plug into a rootless Cloud Hypervisor sandbox
# on a hosted runner, using an emulated PCI device behind an emulated IOMMU.
# See tests/clh-vfio-nested/host.sh.

on:
  pull_request:
    paths:
      - src/runtime-rs/**
      - src/libs/**
      - tests/clh-vfio-nested/**
      - .github/workflows/clh-vfio-nested.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clh-vfio-nested:
    name: clh-vfio-nested
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential protobuf-compiler qemu-system-x86 qemu-utils cloud-image-utils zstd

      - name: Install yq
        run: |
          sudo -E ./ci/install_yq.sh
        env:
          INSTALL_IN_GOPATH: false

      - name: Install rust
        run: |
          ./tests/install_rust.sh

      - name: Build the runtime-rs shim
        run: |
          export PATH="${PATH}:${HOME}/.cargo/bin"
          make -C src/runtime-rs LIBC=gnu

      - name: Cold plug an emulated device into a rootless CLH sandbox
        run: |
          ./tests/clh-vfio-nested/host.sh \
            target/x86_64-unknown-linux-gnu/release/containerd-shim-kata-v2 \
            src/runtime-rs/config/configuration-clh-runtime-rs.toml \
            "${RUNNER_TEMP}/clh-vfio-nested"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: clh-vfio-nested-logs
          path: ${{ runner.temp }}/clh-vfio-nested/out
          retention-days: 7
